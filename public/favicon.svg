<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Cream-beige border square -->
  <rect width="100" height="100" fill="#e9d8c6"/>
  <!-- Inner split: pink left, cream right -->
  <rect x="6" y="6" width="44" height="88" fill="#ff2e76"/>
  <rect x="50" y="6" width="44" height="88" fill="#fbf5ee"/>
  <!-- Color-flipped center circle: cream over pink half, pink over cream half -->
  <path d="M 50 24 A 26 26 0 0 0 50 76 Z" fill="#fbf5ee"/>
  <path d="M 50 24 A 26 26 0 0 1 50 76 Z" fill="#ff2e76"/>
</svg>
